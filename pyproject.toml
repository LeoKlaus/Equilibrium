[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Deliberately curated rather than "ALL" - ruff's own guidance advises
# against ALL for ongoing use, it's too broad/noisy. N (pep8-naming) is
# intentionally left out for now: this codebase uses PascalCase module/
# package names deliberately (one exported class per file, matching the
# class name). Renaming to snake_case is planned as its own dedicated
# final phase, not mixed into ongoing lint enforcement yet.
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",  # line-too-long - no auto-formatter is adopted here, and
             # manually rewrapping lines by hand is pure cosmetic risk
             # (dense f-strings, migration DDL) for no functional benefit.
]

[tool.mypy]
python_version = "3.14"

# bluez_peripheral and pigpio ship no type stubs and no py.typed marker,
# so every import of them is otherwise flagged as import-untyped.
[[tool.mypy.overrides]]
module = ["bluez_peripheral.*", "pigpio"]
ignore_missing_imports = true
