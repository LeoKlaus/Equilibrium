services:
  equilibrium:
    image: ghcr.io/leoklaus/equilibrium:latest
    restart: unless-stopped
    environment:
      # DEBUG, INFO, WARNING (default), ERROR or CRITICAL. Set via .env.
      - LOG_LEVEL=${LOG_LEVEL:-WARNING}
      # Runs commands with a script_path as executables from
      # config/scripts - only enable if you trust everything with
      # access to the HTTP API. Set via setup_host.sh or .env.
      - ENABLE_SCRIPTS=${ENABLE_SCRIPTS:-false}
      # Name this hub advertises over mDNS/Bonjour. Every hub on the
      # same network needs a different one. Set via setup_host.sh or
      # by hand in .env.
      - INSTANCE_NAME=${INSTANCE_NAME:-Equilibrium}
    # Host networking so mDNS advertising (zeroconf) works without extra plumbing
    network_mode: host
    # Privileged + /dev mounted in: pyrf24 needs direct SPI/GPIO access
    # for the RF24 radio. Device paths vary across Pi models/OS
    # versions, so this is simpler and more portable than enumerating
    # individual devices.
    privileged: true
    volumes:
      - /dev:/dev
      - ./config:/app/config
      # BlueZ D-Bus access for bluez_peripheral - without this,
      # connecting to the system bus fails with ENOENT and the
      # container crashes during startup (Hub.create() -> BleKeyboard).
      - /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket
